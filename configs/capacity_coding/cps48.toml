extends = ["../paper_5min/_icpc_wf_2025.toml"]

# Task-local capacity baseline; see cps24.toml.
[experiment]
name = "capacity-baseline-coding-cps48"
output_root = "runs/capacity_baseline_coding/cps48"
mode = "cps"
communication = "blackboard"
max_parallel = 48
initial_agents_per_task = 4
max_attempts_per_task = 0
episodes_per_task = 1
max_tasks = 12
time_limit_seconds = 180
seed = 0
cancel_on_proved = true

[aisw]
enabled = true
max_in_flight = 48

[allocation]
agent_timeout_seconds = 180

[judge]
max_concurrent_evaluations = 48
timeout_seconds = 300
max_lifecycle_seconds = 3600

[pi]
thinking = "max"
timeout_seconds = 180
http_idle_timeout_ms = 600000

[selection]
enabled = false

[docker]
memory_mb = 32768
