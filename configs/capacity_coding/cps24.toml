extends = ["../paper_5min/_icpc_wf_2025.toml"]

# Task-local capacity baseline.  This manifest is committed only in the
# temporary capacity-baseline worktree so the formal launcher can bind an
# auditable closure; it is not a paper result or an algorithm change.
[experiment]
name = "capacity-baseline-coding-cps24"
output_root = "runs/capacity_baseline_coding/cps24"
mode = "cps"
communication = "blackboard"
max_parallel = 24
initial_agents_per_task = 2
max_attempts_per_task = 0
episodes_per_task = 1
max_tasks = 12
time_limit_seconds = 180
seed = 0
cancel_on_proved = true

[aisw]
enabled = true
max_in_flight = 24

[allocation]
agent_timeout_seconds = 180

[judge]
max_concurrent_evaluations = 24
timeout_seconds = 300
max_lifecycle_seconds = 3600

[pi]
thinking = "max"
timeout_seconds = 180
http_idle_timeout_ms = 600000

[selection]
enabled = false

[docker]
memory_mb = 32768
